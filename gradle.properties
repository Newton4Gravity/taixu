# Use Aliyun mirrors for all Maven Central artifacts
systemProp.gradle.plugin.portal.url=https://plugins.gradle.org/m2/
systemProp.maven.repo.central=https://maven.aliyun.com/repository/central/
systemProp.maven.repo.google=https://maven.aliyun.com/repository/google/
systemProp.maven.repo.gradle-plugin=https://maven.aliyun.com/repository/gradle-plugin/
systemProp.maven.repo.public=https://maven.aliyun.com/repository/public/

# JVM options for better performance in constrained environments
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true